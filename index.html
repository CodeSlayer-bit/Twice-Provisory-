<style>
/* Layout: one phone-width column, bottom tab bar, screens swapped in place */
:root {
  --bg: #ffffff;
  --surface: #f3f4f6;
  --line: #e3e5ea;
  --line-2: #d5d8de;
  --fg: #15171c;
  --fg-2: #2a2d33;
  --muted: #5b616e;
  --accent: #2f4bff;
  --on-accent: #ffffff;
  --accent-soft: #eaeeff;
  --warm: #ff7a3d;
  --on-warm: #15171c;
  --warm-soft: #ffebdd;
  --ok: #157f4a;
  --danger: #b42318;
  --display: 'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
  --body: 'DM Sans', 'Segoe UI', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1115; --surface: #1a1d24; --line: #2a2e37; --line-2: #3a3f4a;
    --fg: #f2f3f5; --fg-2: #d9dbe0; --muted: #a3a9b5;
    --accent: #8597ff; --on-accent: #0b0d12; --accent-soft: #1f2540;
    --warm: #ff8a52; --on-warm: #15171c; --warm-soft: #3a2418;
    --ok: #5fd39a; --danger: #ff8a80;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1115; --surface: #1a1d24; --line: #2a2e37; --line-2: #3a3f4a;
  --fg: #f2f3f5; --fg-2: #d9dbe0; --muted: #a3a9b5;
  --accent: #8597ff; --on-accent: #0b0d12; --accent-soft: #1f2540;
  --warm: #ff8a52; --on-warm: #15171c; --warm-soft: #3a2418;
  --ok: #5fd39a; --danger: #ff8a80;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 16px; line-height: 1.4; -webkit-font-smoothing: antialiased; }
button, input, textarea, select { font: inherit; color: inherit; }
a { color: inherit; }
#app {
  max-width: 480px; margin: 0 auto; min-height: 100%;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px calc(100px + env(safe-area-inset-bottom, 0px));
}
.screen { display: flex; flex-direction: column; gap: 18px; }
.brand { font-family: var(--display); font-weight: 800; font-size: 30px; letter-spacing: -0.03em; }
.h1 { margin: 0; font-family: var(--display); font-size: 34px; line-height: 1.05; letter-spacing: -0.03em; font-weight: 700; text-wrap: balance; }
.h2 { margin: 0; font-family: var(--display); font-size: 22px; letter-spacing: -0.01em; font-weight: 700; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.label { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.07em; }
.row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.row > span:first-child { min-width: 0; }
.stack { display: flex; flex-direction: column; gap: 8px; }
.num { font-variant-numeric: tabular-nums; }

.demo-pill { font-size: 11px; font-weight: 800; letter-spacing: 0.08em; padding: 3px 8px; border-radius: 999px; background: var(--warm-soft); color: var(--fg); }
.header { display: flex; align-items: center; gap: 10px; }
.back { flex: 0 0 44px; width: 44px; height: 44px; border-radius: 22px; border: 0; background: var(--surface); display: flex; align-items: center; justify-content: center; cursor: pointer; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; padding: 0 20px; border-radius: 16px; border: 0; font-weight: 700; font-size: 16px; cursor: pointer; width: 100%; text-decoration: none; }
.btn-primary { background: var(--accent); color: var(--on-accent); }
.btn-warm { background: var(--warm); color: var(--on-warm); }
.btn-ink { background: var(--fg); color: var(--bg); }
.btn-outline { background: var(--bg); color: var(--fg); border: 1px solid var(--line-2); }
.btn-sm { min-height: 44px; font-size: 15px; border-radius: 12px; width: auto; padding: 0 16px; }
.btn:disabled { opacity: 0.55; cursor: not-allowed; }

.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chips-scroll { display: flex; gap: 8px; overflow-x: auto; margin: 0 -16px; padding: 0 16px 2px; scrollbar-width: none; }
.chip { flex: 0 0 auto; display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line-2); background: var(--bg); font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap; }
.chip.on { background: var(--fg); color: var(--bg); border-color: var(--fg); }

.choice { display: flex; flex-direction: column; align-items: flex-start; gap: 28px; padding: 22px; min-height: 172px; border-radius: 28px; border: 0; text-align: left; cursor: pointer; }
.choice .ic { width: 52px; height: 52px; border-radius: 26px; display: flex; align-items: center; justify-content: center; }
.choice .t { font-family: var(--display); font-size: 28px; font-weight: 700; letter-spacing: -0.02em; display: block; }
.choice .s { font-size: 15px; line-height: 1.4; display: block; margin-top: 6px; }
.choice.rent { background: var(--accent); color: var(--on-accent); }
.choice.rent .ic { background: color-mix(in srgb, var(--on-accent) 18%, transparent); }
.choice.put { background: var(--warm); color: var(--on-warm); }
.choice.put .ic { background: color-mix(in srgb, var(--on-warm) 10%, transparent); }

.card { border: 1px solid var(--line); border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 12px; background: var(--bg); }
.soft { border-radius: 18px; padding: 16px; background: var(--surface); display: flex; flex-direction: column; gap: 10px; }
.warmbox { border-radius: 18px; padding: 16px; background: var(--warm-soft); display: flex; flex-direction: column; gap: 10px; }
.note { border-radius: 14px; padding: 12px 14px; background: var(--accent-soft); font-size: 14px; line-height: 1.45; }
.divider { height: 1px; background: var(--line); }
.kv { display: grid; grid-template-columns: 100px minmax(0, 1fr); gap: 8px 12px; font-size: 14px; margin: 0; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; font-weight: 600; overflow-wrap: anywhere; }
.pill { display: inline-flex; align-self: flex-start; font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: var(--surface); }
.pill.accent { background: var(--accent-soft); color: var(--accent); }
.pill.warm { background: var(--warm-soft); }
.pill.ok { background: color-mix(in srgb, var(--ok) 16%, transparent); color: var(--ok); }

.listing { display: flex; gap: 14px; padding: 10px; border: 1px solid var(--line); border-radius: 20px; background: var(--bg); text-align: left; cursor: pointer; width: 100%; }
.tile { flex: 0 0 96px; height: 104px; border-radius: 14px; display: flex; align-items: center; justify-content: center; overflow: hidden; color: var(--fg); }
.tile img { width: 100%; height: 100%; object-fit: cover; }
.listing .info { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 5px; padding: 2px 4px 2px 0; }
.listing .tt { font-size: 16px; font-weight: 700; line-height: 1.25; }
.price { font-size: 17px; font-weight: 700; color: var(--accent); }

.hero { height: 240px; border-radius: 22px; display: flex; align-items: center; justify-content: center; overflow: hidden; max-width: 100%; }
.hero img { width: 100%; height: 100%; object-fit: cover; }
.avatar { flex: 0 0 44px; width: 44px; height: 44px; border-radius: 22px; background: var(--accent-soft); color: var(--accent); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 17px; }

.field { display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600; }
.input { height: 48px; width: 100%; border: 1px solid var(--line-2); border-radius: 12px; padding: 0 14px; font-size: 16px; background: var(--bg); font-weight: 400; }
textarea.input { height: auto; min-height: 92px; padding: 12px 14px; line-height: 1.4; resize: vertical; }
.money { display: flex; align-items: center; gap: 6px; height: 48px; border: 1px solid var(--line-2); border-radius: 12px; padding: 0 14px; background: var(--bg); }
.money input { border: 0; width: 100%; min-width: 0; font-size: 16px; background: transparent; outline: none; }
.money:focus-within { outline: 2px solid var(--accent); outline-offset: 1px; }
.money span { color: var(--muted); font-weight: 700; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.hint { font-size: 13px; color: var(--muted); font-weight: 400; line-height: 1.4; }
.error { padding: 12px 14px; border-radius: 12px; background: color-mix(in srgb, var(--danger) 14%, transparent); color: var(--danger); font-size: 14px; font-weight: 600; }

.photos { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.slot { position: relative; aspect-ratio: 1 / 1; max-width: 100%; border-radius: 14px; overflow: hidden; background: var(--accent-soft); }
.slot img { width: 100%; height: 100%; object-fit: cover; }
.slot .x { position: absolute; top: 4px; right: 4px; width: 28px; height: 28px; border-radius: 14px; border: 0; background: rgba(15, 17, 21, 0.75); color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.add { position: relative; aspect-ratio: 1 / 1; max-width: 100%; border-radius: 14px; border: 2px dashed var(--line-2); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 12px; font-weight: 700; cursor: pointer; }
.add input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }

.pick { display: flex; align-items: center; gap: 12px; padding: 13px 15px; border-radius: 16px; border: 2px solid var(--fg); background: var(--bg); }

.stepper { display: flex; align-items: center; gap: 6px; }
.stepper button { width: 44px; height: 44px; border-radius: 22px; border: 1px solid var(--line-2); background: var(--bg); cursor: pointer; display: flex; align-items: center; justify-content: center; }
.stepper output { min-width: 28px; text-align: center; font-size: 18px; font-weight: 800; }

.check { width: 72px; height: 72px; border-radius: 36px; display: flex; align-items: center; justify-content: center; margin: 0 auto; }
.mail { border: 1px solid var(--line); border-radius: 20px; overflow: hidden; }
.mail-head { display: flex; align-items: center; gap: 12px; padding: 14px 16px; background: var(--surface); }
.mail-body { padding: 16px; display: flex; flex-direction: column; gap: 12px; font-size: 14px; line-height: 1.45; }

.steps { display: flex; flex-direction: column; gap: 10px; }
.step { display: flex; gap: 12px; align-items: flex-start; font-size: 14px; line-height: 1.4; }
.step .n { flex: 0 0 24px; height: 24px; border-radius: 12px; background: var(--fg); color: var(--bg); font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; }

.paysheet { border: 1px solid var(--line); border-radius: 22px; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.cardnum { display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--line-2); font-variant-numeric: tabular-nums; letter-spacing: 0.06em; }

.timeline { display: flex; flex-direction: column; gap: 0; }
.tl { display: flex; gap: 12px; align-items: flex-start; font-size: 14px; padding-bottom: 12px; position: relative; }
.tl .dot { flex: 0 0 14px; width: 14px; height: 14px; border-radius: 7px; border: 2px solid var(--line-2); background: var(--bg); margin-top: 3px; }
.tl.done .dot { background: var(--accent); border-color: var(--accent); }
.tl.now .dot { border-color: var(--accent); }

nav.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; max-width: 480px; margin: 0 auto;
  display: flex; background: var(--bg); border-top: 1px solid var(--line);
  padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px));
}
nav.tabs button { flex: 1 1 0; height: 56px; border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; font-weight: 700; color: var(--muted); cursor: pointer; }
nav.tabs button[aria-current="page"] { color: var(--accent); }

.toast { position: fixed; left: 50%; bottom: calc(88px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 14px; font-weight: 600; z-index: 20; max-width: calc(100% - 32px); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: no-preference) { .screen { animation: in .18s ease-out; } @keyframes in { from { opacity: .9; transform: translateY(3px); } to { opacity: 1; transform: none; } } }
</style>
</head>
<body>
<div id="app"></div>
<nav class="tabs" aria-label="Main" id="tabs"></nav>
<div class="toast" id="toast" role="status" hidden></div>

<script>
(function () {
  'use strict';

  // ───────── Data ─────────
  var POINT = { id: 'vse', name: 'VŠE campus', address: 'nám. W. Churchilla 1938/4, Praha 3', where: 'Lockers in the New Building (exact spot to be confirmed)' };
  var CATS = ['Study', 'Clothing', 'Party', 'Outdoor', 'Sport', 'Travel', 'Kitchen', 'Tools', 'Home'];
  var USAGES = ['Used once', 'Used 2–3 times', 'Used a few times'];
  var TINTS = ['var(--accent-soft)', 'var(--warm-soft)', 'var(--surface)'];
  var ICON = {
    Study: 'M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z M4 19V5 M9 7h6 M9 11h4',
    Clothing: 'M10 6a2 2 0 1 1 2 2v1l9 7H3l9-7',
    Party: 'M6 2h12a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2z M8 14a4 4 0 1 0 8 0a4 4 0 1 0-8 0 M12 6h.01',
    Outdoor: 'M3.5 21 14 3 M20.5 21 10 3 M15.5 21 12 15l-3.5 6 M2 21h20',
    Sport: 'M8 3l4 8 5-5 5 15H2L8 3z',
    Travel: 'M5 7h14v13H5z M9 7V4h6v3 M9 11v5 M15 11v5',
    Kitchen: 'M4 10h16v6a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4z M2 10h20 M9 6c0-1 1-1 1-2 M14 6c0-1 1-1 1-2',
    Tools: 'M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z',
    Home: 'M3 10.5 12 3l9 7.5 M5 9v12h14V9 M10 21v-6h4v6'
  };
  var UI = {
    back: 'M15 18l-6-6 6-6', search: 'M11 4a7 7 0 1 0 0 14a7 7 0 1 0 0-14z M20 20l-4.3-4.3', plus: 'M12 5v14 M5 12h14', minus: 'M5 12h14',
    home: 'M3 10.5 12 3l9 7.5 M5 9v12h14V9 M10 21v-6h4v6', putup: 'M5 3h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z M12 8v8 M8 12h8',
    user: 'M12 4a4 4 0 1 0 0 8a4 4 0 1 0 0-8z M4 21a8 8 0 0 1 16 0', pin: 'M12 22s7-6.5 7-12a7 7 0 1 0-14 0c0 5.5 7 12 7 12z M12 7.5a2.5 2.5 0 1 0 0 5a2.5 2.5 0 1 0 0-5z',
    check: 'M5 13l4 4L19 7', mail: 'M3 5h18v14H3z M3 6l9 7 9-7', camera: 'M3 7h4l2-3h6l2 3h4v13H3z M12 10a3.5 3.5 0 1 0 0 7a3.5 3.5 0 1 0 0-7z',
    close: 'M6 6l12 12 M18 6L6 18', card: 'M3 6h18v12H3z M3 10h18 M7 15h3', lock: 'M6 11h12v10H6z M8 11V8a4 4 0 0 1 8 0v3'
  };

  function seedListings() {
    var L = [
      ['Financial calculator TI BA II Plus', 'Study', 40, 600, 'Used a few times', 'Kateřina N.', 'Allowed in most VŠE finance exams. Fresh battery, comes with the cover and the quick guide.'],
      ['Men’s suit, size 50, navy', 'Clothing', 250, 1500, 'Used once', 'Tomáš V.', 'Bought for the VŠE ball, worn one evening. Dry-cleaned. Jacket and trousers, no shirt.'],
      ['Evening dress, size S, dark green', 'Clothing', 250, 1500, 'Used once', 'Lucie P.', 'Floor length, worn once to a ball. Dry-cleaned and ready to go.'],
      ['Camping tent, 3-person', 'Outdoor', 120, 1000, 'Used once', 'Marco R.', 'Bought for one festival weekend. Packs into a 55 cm bag, pegs and groundsheet included.'],
      ['Bluetooth party speaker', 'Party', 150, 1200, 'Used 2–3 times', 'Jakub D.', 'Loud enough for a dorm party of 40. 12-hour battery, wireless microphone included.'],
      ['Mini projector + 100" screen', 'Party', 180, 1500, 'Used 2–3 times', 'Anna K.', 'HD projector with phone mirroring and a pull-up screen. Perfect for a film night in the dorm.'],
      ['Ski jacket, size M', 'Sport', 100, 800, 'Used once', 'Inês C.', 'Waterproof and warm, worn for one week in the Alps. Washed.'],
      ['Large suitcase, 90 L', 'Travel', 70, 700, 'Used once', 'Sofia M.', 'Hard shell, four wheels, TSA lock. Ideal for a long Erasmus trip.'],
      ['Cordless drill + bit set', 'Tools', 80, 800, 'Used 2–3 times', 'Pavel H.', 'Two batteries and a charger. Enough for shelves and flat-pack furniture in your room.'],
      ['Raclette grill for 8', 'Kitchen', 90, 600, 'Used once', 'Lena W.', 'Eight pans and a grill plate on top. Great for an international dinner night.'],
      ['Corporate Finance (Berk & DeMarzo)', 'Study', 30, 500, 'Used a few times', 'Ondřej S.', 'Global edition. Some pencil notes in chapters 1 to 6, otherwise clean.'],
      ['Steam iron', 'Home', 30, 300, 'Used once', 'Klára B.', 'For the morning of the interview or presentation. Includes a small ironing mat.']
    ];
    return L.map(function (r, i) {
      return { id: 'L' + (i + 1), title: r[0], cat: r[1], price: r[2], deposit: r[3], usage: r[4], owner: r[5], desc: r[6], photos: [], tint: TINTS[i % 3], mine: false, active: true, available: true, phone: '+420 7' + String(10 + i) + ' 000 ' + String(100 + i), email: r[5].split(' ')[0].toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '') + '@example.com' };
    });
  }

  var KEY = 'twice-demo-v1';
  var store = { listings: seedListings(), bookings: [], me: { name: '', phone: '', email: '' } };
  try {
    var saved = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (saved && saved.listings) store = saved;
  } catch (e) {}
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(store)); return true; } catch (e) { return false; }
  }

  // ───────── Helpers ─────────
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function kc(n) { return Math.round(n).toLocaleString('cs-CZ') + ' Kč'; }
  function icon(d, size, stroke) { return '<svg width="' + (size || 20) + '" height="' + (size || 20) + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="' + (stroke || 2) + '" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="' + d + '"/></svg>'; }
  function byId(id) { for (var i = 0; i < store.listings.length; i++) if (store.listings[i].id === id) return store.listings[i]; return null; }
  function bookingById(id) { for (var i = 0; i < store.bookings.length; i++) if (store.bookings[i].id === id) return store.bookings[i]; return null; }
  var WD = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'], MO = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  function day(offset) { var d = new Date(); d.setDate(d.getDate() + offset); return WD[d.getDay()] + ' ' + d.getDate() + ' ' + MO[d.getMonth()]; }
  function thumb(l, cls) {
    return '<span class="' + (cls || 'tile') + '" style="background:' + l.tint + '">' + (l.photos[0] ? '<img src="' + l.photos[0] + '" alt="">' : icon(ICON[l.cat] || ICON.Home, cls === 'hero' ? 88 : 40, cls === 'hero' ? 1.2 : 1.6)) + '</span>';
  }
  function listingCard(l, meta, act) {
    return '<button class="listing" data-act="' + (act || 'open') + '" data-id="' + l.id + '">' + thumb(l) +
      '<span class="info"><span class="tt">' + esc(l.title) + '</span>' +
      '<span class="small muted">' + esc(meta || (POINT.name + ' · ' + l.owner)) + '</span>' +
      '<span class="pill">' + esc(l.usage) + '</span>' +
      '<span style="margin-top:auto;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap"><span class="price num">' + kc(l.price) + ' / day</span><span class="small muted num">+ ' + kc(l.deposit) + ' deposit</span></span></span></button>';

      if (v === 'done') { var li = byId(bk.listingId); if (li) li.available = true; }
      save(); render();
      toast({ ready: bk.role === 'owner' ? 'The renter was emailed: it is in the locker.' : 'Email: your item is in the locker.', returned: bk.role === 'owner' ? 'Email: the renter put it back.' : 'Thanks! The owner will check it.', done: bk.role === 'owner' ? 'Rent paid out, deposit released.' : 'Deposit released. Only the rent was charged.' }[v]);
    }
    else if (a === 'cancel') { var bc = bookingById(id); if (bc) { bc.status = 'cancelled'; var lc = byId(bc.listingId); if (lc) lc.available = true; save(); render(); toast('Cancelled. Nothing was charged.'); } }
    else if (a === 'reset') {
      if (t.getAttribute('data-confirm') !== '1') { t.setAttribute('data-confirm', '1'); t.textContent = 'Tap again to delete your ads and bookings'; return; }
      store = { listings: seedListings(), bookings: [], me: { name: '', phone: '', email: '' } }; save(); draft = newDraft(); toast('Demo reset.'); go('home');
    }
  });

  document.addEventListener('input', function (e) {
    var f = e.target.getAttribute('data-f'); if (f) draft[f] = e.target.value;
    if (e.target.getAttribute('data-ui') === 'q') {
      ui.q = e.target.value; var res = document.getElementById('results'); if (res) res.innerHTML = rentResults();
    }
  });

  document.addEventListener('change', function (e) {
    if (e.target.id !== 'photo' || !e.target.files) return;
    var files = Array.prototype.slice.call(e.target.files, 0, 4 - draft.photos.length);
    Promise.all(files.map(shrink)).then(function (urls) { draft.photos = draft.photos.concat(urls.filter(Boolean)).slice(0, 4); render(); });
  });

  function shrink(file) {
    return new Promise(function (resolve) {
      var r = new FileReader();
      r.onload = function () {
        var img = new Image();
        img.onload = function () {
          var s = Math.min(1, 900 / Math.max(img.width, img.height));
          var c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
          resolve(c.toDataURL('image/jpeg', 0.72));
        };
        img.onerror = function () { resolve(null); };
        img.src = r.result;
      };
      r.onerror = function () { resolve(null); };
      r.readAsDataURL(file);
    });
  }

  function publish() {
    var d = draft, price = parseInt(String(d.price).replace(/\D/g, ''), 10), dep = parseInt(String(d.deposit).replace(/\D/g, '') || '0', 10);
    d.error = '';
    if (d.title.trim().length < 3) d.error = 'Give your item a title.';
    else if (!d.cat) d.error = 'Choose a category.';
    else if (!(price >= 10)) d.error = 'Set a price of at least 10 Kč per day.';
    else if (!d.name.trim() || !/^\S+@\S+\.\S+$/.test(d.email.trim())) d.error = 'Add your name and a valid email.';
    if (d.error) { render(); window.scrollTo(0, 0); return; }
    store.me = { name: d.name.trim(), phone: d.phone.trim(), email: d.email.trim() };
    var l = { id: 'M' + Date.now(), title: d.title.trim(), cat: d.cat, price: price, deposit: dep, usage: d.usage, owner: d.name.trim(), desc: d.desc.trim() || 'No description yet.', photos: d.photos.slice(), tint: 'var(--warm-soft)', mine: true, active: true, available: true, phone: d.phone.trim() || '—', email: d.email.trim() };
    store.listings.unshift(l);
    if (!save()) { l.photos = l.photos.slice(0, 1); if (!save()) toast('Saved for this session only (phone storage is full).'); }
    draft = newDraft(); go('live', { id: l.id });
  }

  render();
})();
</script>
<script>
if ('serviceWorker' in navigator) { window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); }); }
</script>
